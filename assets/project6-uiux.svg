<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="100%">
  <rect width="800" height="560" fill="#120520"/>
  <rect x="24" y="24" width="752" height="512" fill="none" stroke="#E0C9A6" stroke-width="1" stroke-opacity="0.3"/>

  <text x="48" y="60" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600" fill="#E0C9A6" letter-spacing="3">CASE STUDY 06 / UI/UX DESIGN &amp; DEV</text>
  <text x="752" y="60" text-anchor="end" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600" fill="#7C3AED" letter-spacing="2">NEO SPATIAL STUDIO</text>

  <!-- Desktop Browser Viewport Window Mockup -->
  <g transform="translate(48, 88)">
    <rect width="520" height="416" fill="#1B0A2C" rx="4" stroke="#7C3AED" stroke-width="1.5"/>
    
    <!-- Browser Header / Chrome -->
    <rect width="520" height="34" fill="#0E0317" rx="4"/>
    <circle cx="20" cy="17" r="4.5" fill="#EF4444"/>
    <circle cx="36" cy="17" r="4.5" fill="#F59E0B"/>
    <circle cx="52" cy="17" r="4.5" fill="#10B981"/>
    
    <!-- Address Bar -->
    <rect x="80" y="8" width="300" height="18" fill="#1B0A2C" rx="2"/>
    <text x="92" y="21" font-family="'Inter', sans-serif" font-size="9" fill="#A79BB0">https://neo-spatial.studio/engine</text>

    <!-- Browser Body Content -->
    <!-- Nav inside site -->
    <rect x="0" y="34" width="520" height="38" fill="#140621"/>
    <text x="24" y="58" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" fill="#E0C9A6">NEO</text>
    <text x="120" y="58" font-family="'Inter', sans-serif" font-size="9" fill="#D4CCE0">Canvas</text>
    <text x="180" y="58" font-family="'Inter', sans-serif" font-size="9" fill="#D4CCE0">Shaders</text>
    <text x="240" y="58" font-family="'Inter', sans-serif" font-size="9" fill="#D4CCE0">Docs</text>
    <rect x="420" y="44" width="80" height="22" fill="#7C3AED"/>
    <text x="460" y="58" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="8" font-weight="700" fill="#FFFFFF">LAUNCH</text>

    <!-- Hero UI inside window -->
    <rect x="24" y="90" width="472" height="150" fill="#0C0214" stroke="#280C42" stroke-width="1"/>
    <text x="48" y="130" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="700" fill="#FAF7F2">INTERACTIVE 3D ENGINE</text>
    <text x="48" y="152" font-family="'Inter', sans-serif" font-size="10" fill="#A79BB0">Built for precision architectural spatial computing.</text>
    <rect x="48" y="170" width="110" height="32" fill="#E0C9A6"/>
    <text x="103" y="190" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="700" fill="#120520">START TESTING</text>

    <!-- Spatial Wireframe Graphic inside hero -->
    <g transform="translate(360, 110)">
      <polygon points="50,10 90,35 90,85 50,110 10,85 10,35" fill="none" stroke="#7C3AED" stroke-width="2"/>
      <line x1="50" y1="10" x2="50" y2="60" stroke="#E0C9A6" stroke-width="1.5"/>
      <line x1="90" y1="35" x2="50" y2="60" stroke="#E0C9A6" stroke-width="1.5"/>
      <line x1="10" y1="35" x2="50" y2="60" stroke="#E0C9A6" stroke-width="1.5"/>
      <line x1="50" y1="60" x2="50" y2="110" stroke="#E0C9A6" stroke-width="1.5"/>
      <circle cx="50" cy="60" r="5" fill="#7C3AED"/>
    </g>

    <!-- Bottom Feature Cards inside browser -->
    <g transform="translate(24, 260)">
      <rect x="0" y="0" width="144" height="120" fill="#140621" stroke="#2E104A" stroke-width="1"/>
      <text x="16" y="30" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" fill="#E0C9A6">01 / LATENCY</text>
      <text x="16" y="55" font-family="'Inter', sans-serif" font-size="9" fill="#D4CCE0">&lt; 4ms WebGPU render</text>
      <rect x="16" y="80" width="60" height="4" fill="#7C3AED"/>

      <rect x="164" y="0" width="144" height="120" fill="#140621" stroke="#2E104A" stroke-width="1"/>
      <text x="16" y="30" transform="translate(164,0)" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" fill="#E0C9A6">02 / PROTOCOL</text>
      <text x="16" y="55" transform="translate(164,0)" font-family="'Inter', sans-serif" font-size="9" fill="#D4CCE0">OpenXR Compliant</text>
      <rect x="180" y="80" width="80" height="4" fill="#E0C9A6"/>

      <rect x="328" y="0" width="144" height="120" fill="#140621" stroke="#2E104A" stroke-width="1"/>
      <text x="16" y="30" transform="translate(328,0)" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" fill="#E0C9A6">03 / EXPORT</text>
      <text x="16" y="55" transform="translate(328,0)" font-family="'Inter', sans-serif" font-size="9" fill="#D4CCE0">GLTF 2.0 + USDZ</text>
      <rect x="344" y="80" width="70" height="4" fill="#7C3AED"/>
    </g>
  </g>

  <!-- Mobile Viewport Mockup (Right) -->
  <g transform="translate(590, 108)">
    <rect width="160" height="320" fill="#0D0316" rx="16" stroke="#E0C9A6" stroke-width="2"/>
    <!-- Speaker & Camera notch -->
    <rect x="55" y="10" width="50" height="8" rx="4" fill="#1C092C"/>
    
    <!-- Mobile App Screen -->
    <rect x="10" y="28" width="140" height="264" fill="#180726" rx="6"/>
    
    <text x="24" y="54" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" fill="#E0C9A6">NEO APP</text>
    <rect x="24" y="70" width="112" height="60" fill="#0A0210" stroke="#7C3AED" stroke-width="1"/>
    <circle cx="80" cy="100" r="16" fill="none" stroke="#E0C9A6" stroke-width="1"/>
    <text x="80" y="103" text-anchor="middle" font-family="'Inter', sans-serif" font-size="7" fill="#7C3AED">XR SYNC</text>
    
    <rect x="24" y="145" width="112" height="30" fill="#E0C9A6"/>
    <text x="80" y="163" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="8" font-weight="700" fill="#120520">VIEW PROTOTYPE</text>

    <!-- Bottom Indicator -->
    <rect x="50" y="304" width="60" height="3" rx="1.5" fill="#E0C9A6"/>
  </g>
</svg>
