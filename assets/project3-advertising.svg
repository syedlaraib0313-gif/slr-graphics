<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="100%">
  <rect width="800" height="560" fill="#12041D"/>
  <rect x="24" y="24" width="752" height="512" fill="none" stroke="#E0C9A6" stroke-width="1" stroke-opacity="0.3"/>

  <text x="48" y="60" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600" fill="#E0C9A6" letter-spacing="3">CASE STUDY 03 / ADVERTISING CREATIVE</text>
  <text x="752" y="60" text-anchor="end" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600" fill="#7C3AED" letter-spacing="2">SWISS POSTER &amp; TRANSIT</text>

  <!-- Left: Main Large Poster Mockup -->
  <g transform="translate(48, 88)">
    <rect width="320" height="420" fill="#E0C9A6" rx="2" stroke="#12041D" stroke-width="2"/>
    <rect x="12" y="12" width="296" height="396" fill="none" stroke="#12041D" stroke-width="1"/>
    
    <!-- Bold Typography Layout -->
    <text x="24" y="52" font-family="'Space Grotesk', sans-serif" font-size="34" font-weight="700" fill="#12041D" letter-spacing="-1">MONOLITH</text>
    <text x="24" y="78" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600" fill="#7C3AED" letter-spacing="3">ARCHITECTURE BIENNALE</text>
    
    <line x1="24" y1="94" x2="296" y2="94" stroke="#12041D" stroke-width="2"/>
    
    <!-- Geometric Architectural Art -->
    <g transform="translate(24, 110)">
      <rect x="0" y="0" width="180" height="180" fill="#12041D"/>
      <polygon points="180,0 272,60 272,240 180,180" fill="#2E0E4D"/>
      <polygon points="0,180 92,240 272,240 180,180" fill="#7C3AED"/>
      <line x1="0" y1="0" x2="92" y2="60" stroke="#E0C9A6" stroke-width="1.5"/>
      <line x1="92" y1="60" x2="272" y2="60" stroke="#E0C9A6" stroke-width="1.5"/>
      <line x1="92" y1="60" x2="92" y2="240" stroke="#E0C9A6" stroke-width="1.5"/>
    </g>

    <text x="24" y="380" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700" fill="#12041D">OCTOBER 14 : 28</text>
    <text x="24" y="396" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#4A453E" letter-spacing="1">MUSEUM OF CONTEMPORARY FORM / HALL B</text>
  </g>

  <!-- Right: Billboard & Transit Mockup -->
  <g transform="translate(396, 88)">
    <!-- Horizontal Billboard Frame -->
    <rect width="356" height="200" fill="#1A072B" stroke="#7C3AED" stroke-width="1.5" rx="2"/>
    <!-- Screen Bezel -->
    <rect x="10" y="10" width="336" height="180" fill="#E0C9A6"/>
    
    <!-- Billboard Composition -->
    <text x="24" y="44" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="700" fill="#12041D" letter-spacing="-0.5">MONOLITH</text>
    <text x="24" y="64" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#7C3AED" letter-spacing="2">INTERNATIONAL FORUM</text>
    <text x="24" y="100" font-family="'Inter', sans-serif" font-size="11" fill="#12041D" font-weight="500">RAW CONCRETE / STRUCTURAL PURITY</text>
    
    <g transform="translate(220, 30)">
      <rect x="0" y="0" width="96" height="130" fill="#12041D"/>
      <polygon points="96,0 96,130 0,130" fill="#7C3AED"/>
      <circle cx="48" cy="65" r="24" fill="#E0C9A6"/>
    </g>

    <text x="24" y="160" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="600" fill="#12041D">RESERVE: TICKETS.MONOLITH.ORG</text>
  </g>

  <!-- Technical Spec Details -->
  <g transform="translate(396, 312)">
    <rect width="356" height="196" fill="#0C0214" stroke="#2B0E44" stroke-width="1"/>
    <text x="20" y="36" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#E0C9A6">CAMPAIGN SPECIFICATIONS</text>
    <line x1="20" y1="50" x2="336" y2="50" stroke="#7C3AED" stroke-width="1"/>
    
    <text x="20" y="76" font-family="'Inter', sans-serif" font-size="10" fill="#D4CCE0">• 48-Sheet Outdoor Highway Billboards</text>
    <text x="20" y="102" font-family="'Inter', sans-serif" font-size="10" fill="#D4CCE0">• Subway Station 6-Sheet Transit Posters</text>
    <text x="20" y="128" font-family="'Inter', sans-serif" font-size="10" fill="#D4CCE0">• High-DPI Digital Motion LED Displays</text>
    <text x="20" y="154" font-family="'Inter', sans-serif" font-size="10" fill="#D4CCE0">• Complete Dieline &amp; Large-Format Press Kits</text>
    
    <text x="20" y="180" font-family="'Space Grotesk', sans-serif" font-size="9" fill="#7C3AED">COLOR PROFILE: FOGRA39 / ISO COATED V2</text>
  </g>
</svg>
