<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="100%">
  <defs>
    <pattern id="grid-p1" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2D1445" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>
  </defs>
  <!-- Background -->
  <rect width="800" height="560" fill="#180828"/>
  <rect width="800" height="560" fill="url(#grid-p1)"/>

  <!-- Subtle Editorial Frame -->
  <rect x="24" y="24" width="752" height="512" fill="none" stroke="#E0C9A6" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Metadata Header -->
  <text x="48" y="60" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600" fill="#E0C9A6" letter-spacing="3">CASE STUDY 01 / BRAND IDENTITY</text>
  <text x="752" y="60" text-anchor="end" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600" fill="#7C3AED" letter-spacing="2">SYSTEM SPECIFICATION</text>

  <!-- Main Card / Brand Board Mockup -->
  <g transform="translate(48, 88)">
    <!-- Base Board -->
    <rect width="420" height="420" fill="#E0C9A6" rx="2"/>
    <rect x="12" y="12" width="396" height="396" fill="none" stroke="#180828" stroke-width="1" stroke-opacity="0.4"/>
    
    <!-- Brand Mark Central -->
    <circle cx="210" cy="180" r="72" fill="#180828"/>
    <circle cx="210" cy="180" r="64" fill="none" stroke="#E0C9A6" stroke-width="2"/>
    <path d="M185 155 L210 205 L235 155" fill="none" stroke="#E0C9A6" stroke-width="6" stroke-linecap="square"/>
    <circle cx="210" cy="195" r="7" fill="#7C3AED"/>
    
    <text x="210" y="290" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="700" fill="#180828" letter-spacing="4">KAIROS</text>
    <text x="210" y="315" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#180828" letter-spacing="5">ARTISAN COFFEE ROASTERS</text>
    
    <!-- Color Swatches Row -->
    <g transform="translate(36, 350)">
      <rect x="0" y="0" width="60" height="28" fill="#180828"/>
      <rect x="70" y="0" width="60" height="28" fill="#7C3AED"/>
      <rect x="140" y="0" width="60" height="28" fill="#C4AA84"/>
      <rect x="210" y="0" width="60" height="28" fill="#FFFFFF"/>
      <rect x="280" y="0" width="68" height="28" fill="#2E1065"/>
      <text x="30" y="42" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="8" fill="#180828">#180828</text>
      <text x="100" y="42" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="8" fill="#180828">#7C3AED</text>
      <text x="170" y="42" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="8" fill="#180828">#C4AA84</text>
      <text x="240" y="42" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="8" fill="#180828">#FFFFFF</text>
      <text x="314" y="42" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="8" fill="#180828">#2E1065</text>
    </g>
  </g>

  <!-- Secondary Companion Mockup (Packaging / Label preview) -->
  <g transform="translate(492, 88)">
    <!-- Packaging Pouch Mockup -->
    <rect width="260" height="300" fill="#240D3A" rx="2" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="16" y="20" width="228" height="260" fill="#180828" rx="1"/>
    
    <!-- Top Seal Notch -->
    <line x1="20" y1="50" x2="240" y2="50" stroke="#7C3AED" stroke-width="1" stroke-dasharray="4 2"/>
    <circle cx="130" cy="35" r="4" fill="#E0C9A6"/>

    <!-- Pouch Minimal Label -->
    <rect x="36" y="70" width="188" height="180" fill="#E0C9A6"/>
    <text x="130" y="105" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" fill="#180828" letter-spacing="2">KAIROS</text>
    <text x="130" y="122" text-anchor="middle" font-family="'Inter', sans-serif" font-size="7" font-weight="600" fill="#180828" letter-spacing="2">ORIGIN: ETHIOPIA YIRGACHEFFE</text>
    <line x1="50" y1="135" x2="210" y2="135" stroke="#180828" stroke-width="1"/>
    <text x="130" y="155" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="600" fill="#180828">WASHED / HEIRLOOM</text>
    <text x="130" y="172" text-anchor="middle" font-family="'Inter', sans-serif" font-size="8" fill="#4A453E">Bergamot, Jasmine, Candied Lemon</text>
    
    <!-- Barcode graphic -->
    <g transform="translate(75, 195)">
      <rect x="0" y="0" width="2" height="24" fill="#180828"/>
      <rect x="5" y="0" width="4" height="24" fill="#180828"/>
      <rect x="12" y="0" width="1" height="24" fill="#180828"/>
      <rect x="16" y="0" width="6" height="24" fill="#180828"/>
      <rect x="26" y="0" width="3" height="24" fill="#180828"/>
      <rect x="32" y="0" width="2" height="24" fill="#180828"/>
      <rect x="37" y="0" width="5" height="24" fill="#180828"/>
      <rect x="46" y="0" width="2" height="24" fill="#180828"/>
      <rect x="52" y="0" width="7" height="24" fill="#180828"/>
      <rect x="63" y="0" width="3" height="24" fill="#180828"/>
      <rect x="70" y="0" width="2" height="24" fill="#180828"/>
      <rect x="76" y="0" width="4" height="24" fill="#180828"/>
      <rect x="84" y="0" width="6" height="24" fill="#180828"/>
      <rect x="94" y="0" width="2" height="24" fill="#180828"/>
      <rect x="100" y="0" width="5" height="24" fill="#180828"/>
      <text x="55" y="36" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="7" fill="#180828">250G NET WT</text>
    </g>

    <!-- Technical Note Card below pouch -->
    <rect x="0" y="316" width="260" height="92" fill="#10051C" stroke="#2D1445" stroke-width="1"/>
    <text x="16" y="342" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="600" fill="#E0C9A6">DESIGN DELIVERABLE</text>
    <text x="16" y="364" font-family="'Inter', sans-serif" font-size="9" fill="#A79BB0">48-Page Visual Identity Manual</text>
    <text x="16" y="382" font-family="'Inter', sans-serif" font-size="9" fill="#A79BB0">Foil Stamp Dielines &amp; Pouch Architecture</text>
    <circle cx="236" cy="362" r="10" fill="#7C3AED"/>
    <path d="M232 362 L235 365 L241 359" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
  </g>
</svg>
