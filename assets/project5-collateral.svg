<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="100%">
  <rect width="800" height="560" fill="#150826"/>
  <rect x="24" y="24" width="752" height="512" fill="none" stroke="#E0C9A6" stroke-width="1" stroke-opacity="0.3"/>

  <text x="48" y="60" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600" fill="#E0C9A6" letter-spacing="3">CASE STUDY 05 / MARKETING COLLATERAL</text>
  <text x="752" y="60" text-anchor="end" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600" fill="#7C3AED" letter-spacing="2">VENTURE SUITE</text>

  <!-- Left: Trifold Brochure Open Mockup -->
  <g transform="translate(48, 96)">
    <!-- Panel 1 -->
    <rect x="0" y="0" width="140" height="300" fill="#E0C9A6" stroke="#150826" stroke-width="1.5"/>
    <text x="70" y="40" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#150826">OVERVIEW</text>
    <line x1="20" y1="55" x2="120" y2="55" stroke="#150826" stroke-width="1"/>
    <rect x="20" y="70" width="100" height="4" fill="#150826"/>
    <rect x="20" y="82" width="90" height="4" fill="#150826"/>
    <rect x="20" y="94" width="95" height="4" fill="#150826"/>
    <circle cx="70" cy="180" r="32" fill="#150826"/>
    <text x="70" y="185" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" fill="#7C3AED">STRATA</text>
    
    <!-- Panel 2 (Center) -->
    <rect x="140" y="0" width="140" height="300" fill="#FAF7F2" stroke="#150826" stroke-width="1.5"/>
    <text x="210" y="40" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#150826">FUND METRICS</text>
    <line x1="160" y1="55" x2="260" y2="55" stroke="#150826" stroke-width="1"/>
    <!-- Minimalist chart mockup -->
    <line x1="160" y1="140" x2="260" y2="140" stroke="#7C3AED" stroke-width="1.5"/>
    <polygon points="160,135 180,110 205,120 230,85 260,70 260,140 160,140" fill="#7C3AED" fill-opacity="0.15"/>
    <polyline points="160,135 180,110 205,120 230,85 260,70" fill="none" stroke="#7C3AED" stroke-width="2"/>
    <rect x="160" y="165" width="100" height="4" fill="#4A453E"/>
    <rect x="160" y="177" width="85" height="4" fill="#4A453E"/>
    <rect x="160" y="189" width="92" height="4" fill="#4A453E"/>

    <!-- Panel 3 (Right) -->
    <rect x="280" y="0" width="140" height="300" fill="#240D3A" stroke="#150826" stroke-width="1.5"/>
    <text x="350" y="40" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#E0C9A6">PARTNERSHIP</text>
    <line x1="300" y1="55" x2="400" y2="55" stroke="#7C3AED" stroke-width="1"/>
    <rect x="300" y="70" width="100" height="4" fill="#E0C9A6" fill-opacity="0.7"/>
    <rect x="300" y="82" width="80" height="4" fill="#E0C9A6" fill-opacity="0.7"/>
    <rect x="300" y="94" width="90" height="4" fill="#E0C9A6" fill-opacity="0.7"/>
    <rect x="310" y="220" width="80" height="26" fill="#7C3AED"/>
    <text x="350" y="237" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="8" font-weight="700" fill="#FFFFFF">INQUIRE</text>
  </g>

  <!-- Right: Overlapping Luxury Business Cards -->
  <g transform="translate(496, 96)">
    <!-- Card 1 (Dark Purple Foil) -->
    <rect x="0" y="20" width="250" height="150" fill="#240D3A" rx="2" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="24" y="55" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700" fill="#E0C9A6" letter-spacing="2">STRATA</text>
    <text x="24" y="70" font-family="'Inter', sans-serif" font-size="7" font-weight="600" fill="#7C3AED" letter-spacing="2">VENTURE PARTNERS</text>
    <text x="24" y="115" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="600" fill="#FAF7F2">MARCUS VANE</text>
    <text x="24" y="130" font-family="'Inter', sans-serif" font-size="8" fill="#A79BB0">MANAGING GENERAL PARTNER</text>
    <circle cx="210" cy="50" r="14" fill="#E0C9A6"/>
    
    <!-- Card 2 (Warm Sand Textured Stock - overlapping) -->
    <rect x="25" y="145" width="250" height="150" fill="#E0C9A6" rx="2" stroke="#150826" stroke-width="2"/>
    <text x="49" y="180" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700" fill="#150826" letter-spacing="2">STRATA</text>
    <line x1="49" y1="195" x2="235" y2="195" stroke="#150826" stroke-width="1"/>
    <text x="49" y="220" font-family="'Inter', sans-serif" font-size="8" fill="#150826">SAN FRANCISCO : LONDON : ZURICH</text>
    <text x="49" y="240" font-family="'Inter', sans-serif" font-size="8" font-weight="600" fill="#7C3AED">CONTACT: MARCUSS@STRATA.VC</text>
    <text x="49" y="260" font-family="'Space Grotesk', sans-serif" font-size="8" fill="#150826">PRIVATE PLACEMENT MEMORANDUM</text>
  </g>

  <!-- Bottom: Collateral Scope -->
  <g transform="translate(48, 420)">
    <rect width="704" height="84" fill="#0E0318" stroke="#2D1248" stroke-width="1"/>
    <text x="24" y="32" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#E0C9A6">COLLATERAL SPECIFICATIONS</text>
    <text x="24" y="56" font-family="'Inter', sans-serif" font-size="10" fill="#D4CCE0">• 600gsm Cotton Letterpress Stationery</text>
    <text x="260" y="56" font-family="'Inter', sans-serif" font-size="10" fill="#D4CCE0">• Custom French-Fold Investor Booklets</text>
    <text x="510" y="56" font-family="'Inter', sans-serif" font-size="10" fill="#D4CCE0">• Foil Embossed Envelope Seals</text>
  </g>
</svg>
